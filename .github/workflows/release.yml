name: Release

run-name: Release (${{ inputs.bump }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    uses: otfabric/.github/.github/workflows/go-package-release.yml@v3.8.0
    with:
      bump: ${{ inputs.bump }}
      release-name-prefix: go-cotp
      update-major-tag: false
      # Direct dependants, built, vetted and tested against the candidate
      # before the tag is created.
      consumers: |
        otfabric/go-mms
        otfabric/go-iec61850
        otfabric/go-s7comm
    secrets: inherit
