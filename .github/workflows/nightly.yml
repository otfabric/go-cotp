# Extended tier (otfabric/engineering standards/testing.md#ci-tiers).
name: Nightly
on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # 21 targets at 5 minutes each.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=5m
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-nightly
          path: "**/testdata/fuzz/"

  # Platform width (otfabric/engineering standards/testing.md#platform-width):
  # the codec and the size negotiation convert wire integers to int, so the
  # tests also run where int has 32 bits. ubuntu runners execute 386 binaries;
  # the race detector does not exist for 386.
  test-386:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests on a 32-bit architecture
        run: GOARCH=386 go test -count=1 ./...

  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Chaos (many deterministic seeds)
        env:
          COTP_CHAOS_SEEDS: "200"
        run: go test -count=1 -race -timeout=25m -run Chaos ./...
